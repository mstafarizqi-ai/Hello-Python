<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منشئ الفيديوهات بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <span class="badge">AI STUDIO</span>
        <h1>حوّل فكرتك إلى فيديو</h1>
        <p>اكتب وصفًا، اختَر النمط والمدة، وحمّل مقطعك بصيغة MP4.</p>
      </header>
      <form id="videoForm">
        <label for="title">عنوان الفيديو</label>
        <input id="title" name="title" maxlength="100" placeholder="مثال: إطلاق منتج جديد" required />
        <label for="prompt">وصف الفيديو أو نص المشاهد</label>
        <textarea id="prompt" name="prompt" rows="5" maxlength="1500" placeholder="اكتب فكرة الفيديو بالتفصيل..." required></textarea>
        <div class="grid">
          <div><label for="duration">المدة (ثانية)</label><input id="duration" name="duration" type="number" min="5" max="60" value="15" required /></div>
          <div><label for="style">النمط البصري</label><select id="style" name="style"><option value="cinematic">سينمائي</option><option value="futuristic">مستقبلي</option><option value="minimal">بسيط</option><option value="business">تجاري</option></select></div>
        </div>
        <label for="orientation">أبعاد الفيديو</label>
        <select id="orientation" name="orientation"><option value="16:9">أفقي 16:9</option><option value="9:16">عمودي 9:16</option><option value="1:1">مربع 1:1</option></select>
        <button id="submitButton" type="submit">إنشاء الفيديو</button>
      </form>
      <p id="status" class="status hidden" role="status"></p>
      <section id="result" class="result hidden">
        <h2>فيديوك جاهز</h2>
        <video id="player" controls></video>
        <a id="download" class="download" download>تحميل الفيديو MP4</a>
      </section>
      <p class="note">نسخة تجريبية محلية: تنشئ مشاهد نصية متحركة بصريًا، وقد تضيف تعليقًا صوتيًا عربيًا عند توفر الاتصال بالإنترنت.</p>
    </main>
    <script>
      const form = document.getElementById('videoForm');
      const status = document.getElementById('status');
      const button = document.getElementById('submitButton');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        status.className = 'status';
        status.textContent = 'جارٍ إنشاء الفيديو، قد يستغرق ذلك بعض الوقت...';
        try {
          const response = await fetch('/generate', { method: 'POST', body: new FormData(form) });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || 'تعذر إنشاء الفيديو.');
          const url = `${data.video_url}?t=${Date.now()}`;
          document.getElementById('player').src = url;
          document.getElementById('download').href = data.video_url;
          document.getElementById('result').classList.remove('hidden');
          status.classList.add('success');
          status.textContent = 'تم إنشاء الفيديو بنجاح.';
        } catch (error) {
          status.classList.add('error');
          status.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
